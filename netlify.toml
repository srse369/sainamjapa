[build]
  publish = "web"
  functions = "netlify/functions"

[dev]
  command = ""

# Locale path rewrites
[[redirects]]
  from = "/en/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/es/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/hi/*"
  to = "/index.html"
  status = 200

# SPA catch-all (static files served first)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200