[build]
  publish = "web"
  functions = "netlify/functions"

[dev]
  command = ""

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Locale path rewrites (optional - handles /en/, /es/, /hi/ prefixes)
[[redirects]]
  from = "/en/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/es/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/hi/*"
  to = "/index.html"
  status = 200
