<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sai Nama Japam</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <main class="container">
        <section class="" style="background-color:transparent;">
            <h3 style="text-align: center;">Sathya Sai Nama Japam</h1>
        </section>

        <br/>
        <br/>
        <br/>
        <br/>
        <br/>

        <section class="card dashboard" id="dashboard">
            <h3 style="text-align: center;">Total Count</h3>
            <div class="total">
                <span id="total-count">—</span>
            </div>
        </section>

        <section class="card photo" id="photo-card">
            <img src="/assets/bg.jpg" width="100%" alt="Sathya Sai Baba" />
        </section>

        <section class="card breakdown" id="breakdown-dashboard">
            <h3 style="text-align: center;">Daily Breakdown</h3>
            <div id="daily-histogram" class="histogram" aria-live="polite">
                <!-- bars inserted here -->
            </div>
        </section>

        <section class="card map-card" id="map-section" style="display: none;">
            <h3 style="text-align: center;">Locations</h3>
            <div id="world-map" aria-label="Map of participation locations"></div>
        </section>

        <button id="open-register" class="register-fab" aria-haspopup="dialog" aria-controls="register-modal">Register
            Name</button>
        <button id="open-submit" class="submit-fab" aria-haspopup="dialog" aria-controls="submit-modal">Submit your
            Japam count</button>

        <div id="register-modal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
            <div class="modal-content">
                <button class="modal-close" id="register-modal-close" aria-label="Close">×</button>
                <h2>Register Your Name</h2>
                <form id="register-form">
                    <label>Full Name (required)
                        <input type="text" id="register-name" name="name" placeholder="Your name" required>
                    </label>
                    <p class="muted small">Register once to appear in the submission dropdown.</p>
                    <div class="actions">
                        <button type="submit" id="register-btn">Register</button>
                    </div>
                </form>
                <p id="register-msg" class="muted"></p>
            </div>
        </div>

        <div id="submit-modal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
            <div class="modal-content">
                <button class="modal-close" id="modal-close" aria-label="Close">×</button>
                <h2>Submit Today</h2>
                <form id="submit-form">
                    <label>Name (select or leave anonymous)
                        <select id="name" name="name">
                            <option value="">— Anonymous —</option>
                        </select>
                    </label>
                    <p class="muted small">Your submission will be recorded but your name will not be displayed
                        publicly.</p>

                    <label>Date (required)
                        <input type="date" id="date" name="date" required>
                    </label>

                    <label>Japam Count (required)
                        <input type="number" id="count" name="count" min="0" required>
                    </label>

                    <div class="actions">
                        <button type="submit" id="submit-btn">Submit your Japam count</button>
                    </div>
                </form>
                <p id="form-msg" class="muted"></p>
            </div>
        </div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('showmap') === 'true') {
            document.getElementById('map-section').style.display = 'block';
        }
    </script>
    
    <script src="app.js"></script>
</body>

</html>
